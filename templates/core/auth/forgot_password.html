{% extends "core/base.html" %}

{% block title %}找回密码 — 智慧医疗{% endblock %}

{% block extra_css %}
{{ block.super }}
<style>
  .hover-primary:hover {
    color: #0d9488 !important;
  }
</style>
{% endblock %}

{% block content %}
<div class="card">
  <h1>找回密码</h1>
  <p class="hint" style="margin-top:0;">向注册邮箱获取验证码后设置新密码。若邮箱未绑定患者账号，将无法完成校验。</p>
  <form id="forgotForm" novalidate>
    {% csrf_token %}
    <p>
      <label for="fp-email">电子邮箱</label>
      <input type="email" class="form-control" id="fp-email" name="email" required autocomplete="email" placeholder="请输入注册时使用的邮箱">
    </p>
    <div class="d-flex gap-2 align-items-start flex-wrap mb-3">
      <div class="flex-grow-1" style="min-width: 8rem;">
        <label for="fp-code" class="d-block">邮箱验证码</label>
        <input type="text" class="form-control" id="fp-code" name="verify_code" maxlength="6" inputmode="numeric" pattern="[0-9]*" placeholder="6 位数字" required autocomplete="one-time-code">
      </div>
      <div class="d-flex align-items-end pt-4">
        <button type="button" id="fpSendBtn" class="btn btn-outline-primary text-nowrap">获取验证码</button>
      </div>
    </div>
    <p>
      <label for="fp-pw">新密码</label>
      <input type="password" class="form-control" id="fp-pw" name="new_password" required autocomplete="new-password" placeholder="请设置符合强度要求的新密码">
    </p>
    <p>
      <label for="confirm_password">确认新密码</label>
      <input type="password" class="form-control" id="confirm_password" name="confirm_password" required autocomplete="new-password" placeholder="请再次输入新密码">
    </p>
    <div class="text-center mt-4">
      <button type="submit" class="btn btn-primary px-5 rounded-pill">确认重置</button>
    </div>
    <div class="mt-3 text-center">
      <a href="{% url 'core:login' %}" class="text-muted text-decoration-none small hover-primary"><i class="fas fa-arrow-left me-1"></i> 返回登录</a>
    </div>
  </form>
</div>

<script>
(function () {
  var form = document.getElementById("forgotForm");
  var sendBtn = document.getElementById("fpSendBtn");
  if (!form || !sendBtn) return;

  var emailEl = document.getElementById("fp-email");
  var codeUrl = "{% url 'core:send_email_verify_code' %}";
  var resetUrl = "{% url 'core:forgot_password' %}";
  var loginUrl = "{% url 'core:login' %}";
  var countdownTimer = null;

  function getCsrf() {
    var t = form.querySelector("[name=csrfmiddlewaretoken]");
    return t ? t.value : "";
  }

  function clearCd() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
  }

  sendBtn.addEventListener("click", function () {
    var email = (emailEl.value || "").trim();
    if (!email) {
      window.alert("请先填写邮箱");
      return;
    }
    if (sendBtn.disabled) return;
    sendBtn.disabled = true;
    clearCd();

    var fd = new FormData();
    fd.append("email", email);
    fd.append("action", "reset");
    fd.append("csrfmiddlewaretoken", getCsrf());

    fetch(codeUrl, {
      method: "POST",
      body: fd,
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (r) {
        return r.json().then(function (data) {
          return { ok: r.ok, data: data };
        });
      })
      .then(function (res) {
        if (!res.ok || res.data.status !== "success") {
          window.alert(res.data.msg || "发送失败");
          sendBtn.disabled = false;
          return;
        }
        var sec = 60;
        sendBtn.textContent = sec + "秒后重试";
        countdownTimer = setInterval(function () {
          sec -= 1;
          if (sec <= 0) {
            clearCd();
            sendBtn.disabled = false;
            sendBtn.textContent = "获取验证码";
          } else {
            sendBtn.textContent = sec + "秒后重试";
          }
        }, 1000);
      })
      .catch(function () {
        window.alert("网络错误，请稍后重试");
        sendBtn.disabled = false;
      });
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var newPassword = (document.getElementById("fp-pw").value || "");
    var confirmPassword = (document.getElementById("confirm_password").value || "");
    if (newPassword !== confirmPassword) {
      window.alert("两次输入的密码不一致，请重新输入！");
      return;
    }
    var fd = new FormData(form);
    fetch(resetUrl, {
      method: "POST",
      body: fd,
      credentials: "same-origin",
      headers: { "X-Requested-With": "XMLHttpRequest" }
    })
      .then(function (r) {
        return r.json().then(function (data) {
          return { ok: r.ok, data: data };
        });
      })
      .then(function (res) {
        if (!res.ok || res.data.status !== "success") {
          window.alert(res.data.msg || "重置失败");
          return;
        }
        window.alert(res.data.msg || "密码重置成功！");
        window.location.href = loginUrl;
      })
      .catch(function () {
        window.alert("网络错误，请稍后重试");
      });
  });
})();
</script>
{% endblock %}
