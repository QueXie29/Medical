{% extends "core/base.html" %}
{% block title %}删除科室 — 智慧医疗{% endblock %}
{% block content %}
<div class="card">
  <h1>确认删除科室</h1>
  <p>确定删除「<strong>{{ department.name }}</strong>」吗？若存在受保护的外键关联，删除将失败。</p>
  <form method="post" action="">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#b00020;">确认删除</button>
  </form>
  <p class="hint" style="margin-top:1rem;"><a href="{% url 'core:admin_department_list' %}">取消并返回</a></p>
</div>
{% endblock %}
