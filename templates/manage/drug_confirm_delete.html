{% extends "core/base.html" %}
{% block title %}删除药品 — 智慧医疗{% endblock %}
{% block content %}
<div class="card">
  <h1>确认删除药品</h1>
  <p>确定删除「<strong>{{ drug }}</strong>」吗？若该药品已被处方等引用，将无法删除。</p>
  <form method="post" action="">
    {% csrf_token %}
    <button type="submit" class="btn" style="background:#b00020;">确认删除</button>
  </form>
  <p class="hint" style="margin-top:1rem;"><a href="{% url 'core:admin_drug_list' %}">取消并返回</a></p>
</div>
{% endblock %}
