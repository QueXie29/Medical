{% extends "base_patient.html" %}
{% block title %}删除预问诊报告 — {{ hospital_portal.hospital_name }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 520px;">
  <div class="bg-white rounded-3 shadow-sm p-4 border border-light">
    <h1 class="h5 fw-bold text-danger mb-3">确认删除</h1>
    <p>确定删除报告「<strong>{{ report.title|default:"（无标题）" }}</strong>」吗？此操作不可恢复。</p>
    <p class="text-muted small">若该报告已用于挂号，系统将拒绝删除。</p>
    <form method="post" action="" class="mt-3">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">确认删除</button>
      <a href="{% url 'core:patient_ai_report_list' %}" class="btn btn-outline-secondary ms-2">取消</a>
    </form>
  </div>
</div>
{% endblock %}
