{% extends "patient/personal_center.html" %}
{% block title %}完善个人信息 — {{ hospital_portal.hospital_name }}{% endblock %}
{% block patient_center_main %}
<h2 class="h5 fw-bold mb-3">完善个人信息</h2>
<p class="text-muted small mb-4">以下信息均为选填，便于医护人员为您提供更好的服务。</p>
<form method="post" action="" novalidate>
  {% csrf_token %}
  {% for field in form %}
    <div class="mb-3">
      <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field.errors }}
      {{ field }}
    </div>
  {% endfor %}
  <button type="submit" class="btn btn-primary">保存</button>
</form>
{% endblock %}
